<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POCDNA — Admin Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .navbar {
      background: #16213e;
      padding: 0.75rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #2a2a4a;
    }
    .navbar h1 { font-size: 1.1rem; color: #e94560; }
    .container { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid #2a2a4a;
    }
    .stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;
    }
    .stat {
      text-align: center; padding: 1rem;
      background: #0f0f23; border-radius: 8px;
    }
    .stat .num { font-size: 1.5rem; font-weight: 700; color: #e94560; }
    .stat .label { font-size: 0.7rem; color: #8a8a9a; margin-top: 0.25rem; }
    table {
      width: 100%; border-collapse: collapse; font-size: 0.85rem;
    }
    th {
      text-align: left; padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #2a2a4a; color: #8a8a9a; font-weight: 600;
    }
    td {
      padding: 0.5rem 0.75rem; border-bottom: 1px solid #1a1a3a;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 0.25rem;
    }
    .dot.on { background: #4ade80; }
    .dot.off { background: #6a6a7a; }
    .revoked { opacity: 0.5; text-decoration: line-through; }
    button.danger {
      padding: 0.3rem 0.7rem;
      border: 1px solid #e94560;
      border-radius: 6px;
      background: transparent;
      color: #e94560;
      font-size: 0.75rem;
      cursor: pointer;
    }
    button.danger:hover { background: #3a1520; }
    button.danger:disabled { opacity: 0.3; cursor: not-allowed; }
    input {
      padding: 0.5rem 0.75rem;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      background: #0f0f23;
      color: #e0e0e0;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus { border-color: #e94560; }
    button.primary {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.primary:hover { background: #c73650; }
    .error { color: #e94560; font-size: 0.85rem; margin-top: 0.5rem; }
    .hidden { display: none !important; }
    .back-link { color: #8a8a9a; font-size: 0.85rem; text-decoration: none; }
    .back-link:hover { color: #e94560; }
  </style>
</head>
<body>
  <nav class="navbar">
    <h1>POCDNA Admin</h1>
    <a href="/" class="back-link">← Dashboard</a>
  </nav>

  <div class="container">
    <div id="loginCard" class="card">
      <h2 style="margin-bottom:1rem">Admin Authentication</h2>
      <input type="password" id="adminKey" placeholder="Admin API Key">
      <button class="primary" onclick="authenticate()" style="margin-left:0.5rem">Authenticate</button>
      <div class="error hidden" id="authError">Invalid admin key</div>
    </div>

    <div id="panelContent" class="hidden">
      <div class="stats" id="statsContainer"></div>
      <div class="card" style="margin-top:1rem">
        <h2 style="margin-bottom:1rem">All Terminals</h2>
        <table>
          <thead>
            <tr><th>User</th><th>Label</th><th>Daemon</th><th>TLS</th><th>Registered</th><th>Last Seen</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="terminalTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let apiKey = sessionStorage.getItem('adminKey') || '';

    if (apiKey) {
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('panelContent').classList.remove('hidden');
      loadData();
    }

    async function authenticate() {
      const key = document.getElementById('adminKey').value.trim();
      if (!key) return;

      apiKey = key;
      try {
        const res = await fetch('/api/admin/terminals', {
          headers: { 'x-admin-key': apiKey },
        });
        if (res.ok) {
          sessionStorage.setItem('adminKey', key);
          document.getElementById('loginCard').classList.add('hidden');
          document.getElementById('panelContent').classList.remove('hidden');
          document.getElementById('authError').classList.add('hidden');
          await loadData();
        } else {
          document.getElementById('authError').classList.remove('hidden');
        }
      } catch {
        document.getElementById('authError').classList.remove('hidden');
      }
    }

    async function loadData() {
      try {
        const res = await fetch('/api/admin/terminals', {
          headers: { 'x-admin-key': apiKey },
        });
        const data = await res.json();

        document.getElementById('statsContainer').innerHTML = `
          <div class="stat"><div class="num">${data.stats.total}</div><div class="label">Total</div></div>
          <div class="stat"><div class="num">${data.stats.active}</div><div class="label">Active</div></div>
          <div class="stat"><div class="num">${data.stats.revoked}</div><div class="label">Revoked</div></div>
          <div class="stat"><div class="num">${data.stats.withDaemon}</div><div class="label">With Daemon</div></div>
        `;

        document.getElementById('terminalTable').innerHTML = data.terminals.map(t => `
          <tr class="${t.revokedAt ? 'revoked' : ''}">
            <td>${escapeHtml(t.username)}</td>
            <td>${escapeHtml(t.label)}</td>
            <td><span class="dot ${t.hasDaemon ? 'on' : 'off'}"></span></td>
            <td><span class="dot ${t.hasTls ? 'on' : 'off'}"></span></td>
            <td>${new Date(t.registeredAt).toLocaleDateString()}</td>
            <td>${t.lastSeenAt ? new Date(t.lastSeenAt).toLocaleDateString() : '-'}</td>
            <td>${t.revokedAt ? 'Revoked' : 'Active'}</td>
            <td>
              ${!t.revokedAt ? `<button class="danger" onclick="revokeTerminal('${t.id}')">Revoke</button>` : ''}
            </td>
          </tr>
        `).join('');
      } catch {
        sessionStorage.removeItem('adminKey');
        location.reload();
      }
    }

    async function revokeTerminal(id) {
      if (!confirm('Permanently revoke this terminal?')) return;
      try {
        const res = await fetch(`/api/admin/terminals/${id}/revoke`, {
          method: 'POST',
          headers: { 'x-admin-key': apiKey },
        });
        if (res.ok) await loadData();
      } catch {}
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
